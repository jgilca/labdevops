name: 4. DAST (Dynamic Application Security Testing)
 
on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
 
permissions:
  contents: read # Principio de mínimo privilegio (Slide 266)
 
jobs:
  dast-owasp-zap:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
 
      - name: Construir y arrancar la app en contenedor
        run: |
          docker build -t mi-app-dast .
          docker run -d --name app-target -p 5000:5000 mi-app-dast
          sleep 3
 
      - name: Ejecutar escaneo dinámico OWASP ZAP contra http://localhost:5000
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://172.17.0.1:5000'
          allow_issue_writing: false