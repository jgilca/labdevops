name: 2. SAST (Análisis Estático)
 
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
 
jobs:
  sast-python:
    name: Bandit Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
 
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
 
      - name: Ejecutar Bandit (Falla en severidad MEDIUM o HIGH)
        run: |
          pip install bandit
          bandit -r app.py -ll